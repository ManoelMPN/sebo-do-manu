<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Sebo do Manu</title><link rel="stylesheet" href="/static/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body data-page="admin"><header><a class="brand" href="/">Sebo do Manu</a><button id="logout">Sair</button></header><main>
<section id="loginPanel" class="panel small"><h1>Entrar no painel</h1><form id="loginForm"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button>Entrar</button></form></section>
<div id="adminPanel" hidden><section class="panel"><h1>Catalogar HQs</h1><p>Escolha várias fotos no modo metralhadora ou uma foto com observações no modo assistido.</p><form id="comicForm"><input id="images" type="file" accept="image/*" multiple required><textarea id="notes" placeholder="Defeitos observados, opcional"></textarea><label>Desconto máximo (%)<input id="maxDiscount" type="number" value="10" min="0" max="100"></label><button>Processar e cadastrar lote</button></form><progress id="progress" value="0" max="100"></progress><div id="results"></div></section>
<section class="two"><div class="panel"><h2>Novo colaborador</h2><form id="collabForm"><input name="full_name" placeholder="Nome completo" required><input name="nickname" placeholder="Nickname" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" minlength="8" placeholder="Senha inicial" required><input name="avatar_url" placeholder="URL da foto"><textarea name="bio" placeholder="Bio"></textarea><button>Criar colaborador</button></form></div><div class="panel"><h2>Novo cupom</h2><form id="couponForm"><input name="code" placeholder="Código" required><input name="discount_percent" type="number" min="0.01" max="100" step="0.01" placeholder="Desconto %" required><input name="expires_at" type="datetime-local"><input name="max_uses" type="number" min="1" placeholder="Limite de usos"><button>Criar cupom</button></form></div></section></div></main>
<div id="toast"></div><script>window.APP_CONFIG={{ {'supabaseUrl':supabase_url,'anonKey':anon_key}|tojson }};</script><script src="/static/js/app.js" defer></script></body></html>
