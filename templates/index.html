<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sebo do Manu | HQs</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body data-page="store"><header><a class="brand" href="/">Sebo do Manu</a><div class="stats"><span>Disponíveis <b id="available">0</b></span><span>Em reserva <b id="reserved">0</b></span></div><button id="cartBtn">Carrinho (<span id="cartCount">0</span>)</button></header>
<main><section class="hero"><p class="eyebrow">ACERVO VINTAGE E MODERNO</p><h1>Histórias que merecem uma nova estante.</h1><p>HQs raras e colecionáveis, organizadas por ano, personagem e vendedor.</p></section>
<section><h2>Recém-chegadas</h2><div id="recent" class="carousel"></div></section>
<section><div class="filters"><input id="search" placeholder="Buscar título ou personagem"><input id="year" type="number" placeholder="Ano"><input id="category" placeholder="Categoria"><select id="order"><option value="newest">Mais recentes</option><option value="oldest">Mais antigas primeiro</option><option value="year_desc">Mais novas primeiro</option></select><button id="filterBtn">Filtrar</button></div><div id="catalog" class="grid"></div></section></main>

<dialog id="cartModal"><button class="close">×</button><h2>Seu carrinho</h2><div id="cartItems"></div><form id="checkoutForm"><input name="name" placeholder="Nome" required><input name="email" type="email" placeholder="E-mail" required><input name="whatsapp" placeholder="WhatsApp" required><input name="coupon" placeholder="Cupom"><input name="proposal" type="number" min="0" max="100" step="0.01" placeholder="Proposta de desconto %"><button>Reservar por 15 minutos e pagar</button></form></dialog>
<div id="toast" role="status"></div><script>window.APP_CONFIG={{ {'supabaseUrl':supabase_url,'anonKey':anon_key}|tojson }};</script><script src="/static/js/app.js" defer></script></body></html>
